# tuyapilot2mqtt outside Home Assistant. Copy .env.example to .env and fill it.
services:
  tuyapilot2mqtt:
    build:
      context: ./tuyapilot2mqtt
      dockerfile: Dockerfile
    restart: unless-stopped
    entrypoint: ["tuyapilot2mqtt"]
    environment:
      TUYAPILOT_MQTT_HOST: "${TUYAPILOT_MQTT_HOST:-mosquitto}"
      TUYAPILOT_MQTT_PORT: "${TUYAPILOT_MQTT_PORT:-1883}"
      TUYAPILOT_MQTT_USERNAME: "${TUYAPILOT_MQTT_USERNAME:-}"
      TUYAPILOT_MQTT_PASSWORD: "${TUYAPILOT_MQTT_PASSWORD:-}"
      TUYAPILOT_BASE_TOPIC: "${TUYAPILOT_BASE_TOPIC:-tuyapilot2mqtt}"
      TUYAPILOT_POLL_INTERVAL: "${TUYAPILOT_POLL_INTERVAL:-60}"
      TUYAPILOT_CHANNELS: "${TUYAPILOT_CHANNELS:-lan}"
      TUYAPILOT_LAN_HOST: "${TUYAPILOT_LAN_HOST}"
      TUYAPILOT_LAN_KEYS_FILE: "/keys/devices.json"
      TUYAPILOT_LAN_VERSION: "${TUYAPILOT_LAN_VERSION:-3.3}"
      TUYAPILOT_SHARING_USER_CODE: "${TUYAPILOT_SHARING_USER_CODE:-}"
      TUYAPILOT_SHARING_SESSION_FILE: "/data/sharing_session.json"
      TUYAPILOT_DEVELOPER_ACCESS_ID: "${TUYAPILOT_DEVELOPER_ACCESS_ID:-}"
      TUYAPILOT_DEVELOPER_ACCESS_SECRET: "${TUYAPILOT_DEVELOPER_ACCESS_SECRET:-}"
      TUYAPILOT_DEVELOPER_REGION: "${TUYAPILOT_DEVELOPER_REGION:-eu}"
      TUYAPILOT_WRITES_ENABLED: "${TUYAPILOT_WRITES_ENABLED:-false}"
      TUYAPILOT_WRITE_DEVICES: "${TUYAPILOT_WRITE_DEVICES:-}"
      TUYAPILOT_WRITE_SETTINGS: "${TUYAPILOT_WRITE_SETTINGS:-}"
      TUYAPILOT_TRIAL_SETTING: "${TUYAPILOT_TRIAL_SETTING:-}"
      TUYAPILOT_TRIAL_DEVICE: "${TUYAPILOT_TRIAL_DEVICE:-}"
    volumes:
      # The Smart Life session of the sharing channel (a secret), kept across restarts.
      - "tuyapilot2mqtt-data:/data"
      # The keys file (a secret) stays outside the repository.
      - "${TUYAPILOT_KEYS_DIR:-./keys}:/keys:ro"

volumes:
  tuyapilot2mqtt-data:
