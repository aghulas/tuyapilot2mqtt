[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tuyapilot2mqtt"
description = "Bridge daemon: Tuya pilot-wire thermostats behind a Tuya gateway to MQTT, Zigbee2MQTT dialect (unofficial)."
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "aghulas" }]
dynamic = ["version"]
# pytuya-pilot-wire is not on PyPI yet: the image and the CI install it pinned (see Dockerfile).
dependencies = [
  "pytuya-pilot-wire==0.3.0",
  "paho-mqtt>=2.1,<3",
  "tinytuya==1.20.0",
  "tuya-device-sharing-sdk>=0.2.1,<0.3",
  "segno>=1.6,<2",
]

[project.optional-dependencies]
dev = ["ruff", "pytest", "pyyaml"]

[project.scripts]
tuyapilot2mqtt = "tuyapilot2mqtt.cli:main"

[project.urls]
Homepage = "https://github.com/aghulas/tuyapilot2mqtt"

[tool.setuptools.dynamic]
version = { attr = "tuyapilot2mqtt.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["tuyapilot2mqtt"]

[tool.pytest.ini_options]
testpaths = ["../tests"]
