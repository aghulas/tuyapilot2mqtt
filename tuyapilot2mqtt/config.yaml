name: "tuyapilot2mqtt"
version: "0.3.0"
slug: "tuyapilot2mqtt"
description: "Tuya pilot-wire thermostats behind a Tuya gateway, published to Mosquitto in the Zigbee2MQTT dialect for the Tuya Pilot Wire Companion. Read only by default."
url: "https://github.com/aghulas/tuyapilot2mqtt"
arch:
  - aarch64
  - amd64
init: false
startup: services
services:
  - mqtt:want
# The page of the Smart Life QR-code login ("Open web UI"); reachable through Home Assistant only.
ingress: true
map:
  - type: homeassistant_config
    read_only: true
options:
  base_topic: "tuyapilot2mqtt"
  mqtt_host: ""
  mqtt_port: 1883
  mqtt_username: ""
  mqtt_password: ""
  mqtt_tls: false
  poll_interval: 60
  channels:
    - lan
  lan_host: ""
  lan_keys_file: "/homeassistant/tuyapilot2mqtt/devices.json"
  lan_version: "3.3"
  lan_product_id: "fu1bfwza"
  sharing_user_code: ""
  sharing_session_file: "/data/sharing_session.json"
  developer_access_id: ""
  developer_access_secret: ""
  developer_region: "eu"
  writes_enabled: false
  write_devices: []
schema:
  base_topic: str
  mqtt_host: str?
  mqtt_port: port?
  mqtt_username: str?
  mqtt_password: password?
  mqtt_tls: bool?
  poll_interval: int(15,3600)
  channels:
    - list(lan|sharing|developer)
  lan_host: str?
  lan_keys_file: str?
  lan_version: list(3.3|3.4|3.5)?
  lan_product_id: str?
  sharing_user_code: password?
  sharing_session_file: str?
  developer_access_id: password?
  developer_access_secret: password?
  developer_region: list(eu|us|cn|in|sg)?
  writes_enabled: bool
  write_devices:
    - str
